function tableStep(f) { return { kind: "table", prompt: `Remplis la table de vérité de F (dernière colonne).`, f, vs: sortedVars(f), label: "Table de vérité" }; }
const EXOS = {
  numeration: { g: "→₂", title: "Conversions en série", desc: "Un même nombre dans plusieurs bases, puis un nombre à virgule", make() {

    s[0].label = "Base 10 → base 2"; s[1].label = "Base 10 → base 16"; s[1].prompt += `<br><span class="muted">Astuce : regroupe par 4 les bits trouvés juste avant.</span>`; s[2].label = `Base 10 → base ${b}`; s[3].label = "Base 2 → base 10"; s[4].label = "Réel → base 2"; s[5].label = "Base 2 → réel";

    else s.push(choiceQ(`Que peut-on dire de <b>¬F</b> ?`, k === "taut" ? "¬F est non satisfiable" : "¬F est une tautologie", [k === "taut" ? "¬F est une tautologie" : "¬F est non satisfiable", "¬F est satisfiable mais pas une tautologie"], "P est une tautologie si et seulement si ¬P est non satisfiable (et inversement).", "Négation de F"));
    return { context: `Soit <b>F</b> = ${F(f)}<br><span class="muted">Écriture stricte :</span> <span class="f">${esc(strictStr(f))}</span>`, steps: s };

  simplif: { g: "≡", title: "Simplification guidée", desc: "Justifie chaque étape d'une chaîne d'équivalences", make() {
    const c = pick(CHAINS); let prev = c.s; const steps = [];
    c.L.forEach(([to, law], i) => {
      const others = shuffle(SLAWS.filter(l => l !== law && firstWord(l) !== firstWord(law) && !l.includes(law) && !law.includes(l)));
      steps.push(choiceQ(`Étape ${i + 1} :<br><span class="f">${esc(prev)}</span><br>≡ <span class="f">${esc(to)}</span><br><br>Quelle loi a-t-on utilisée ?`, law, others, `On a utilisé : <b>${law}</b>.`, `Étape ${i + 1} sur ${c.L.length}`));
      prev = to;
    });
    const fin = c.fin || c.L[c.L.length - 1][0];
    steps.push(choiceQ(`Conclusion : la formule de départ est équivalente à…`, fin, c.w, `Chaîne complète :<br><span class="fw">${esc(c.s)}<br>${c.L.map(([t, l]) => `≡ ${esc(t)} <span class="muted">(${esc(l)})</span>`).join("<br>")}</span>`, "Conclusion"));
    return { context: `Simplifier <span class="f big">${esc(c.s)}</span>`, steps };
  } },
  normal: { g: "FNC", title: "Mise en forme normale", desc: "Supprimer les ⇒, descendre les ¬, distribuer", make() {
    let f, e, n, c, d;
    for (let k = 0; k < 200; k++) {
      f = genUsing(2, 3); if (!hasImp(f)) continue;
      e = elimImp(f); n = nnf(e); c = toCNF(n); d = toDNF(n);
      if (size(c) <= 19 && size(d) <= 19 && show(n) !== show(e)) break;
    }
    const st = (title, corr, ref, exp) => { const bads = distract(corr, ref, 3); return choiceQ(title, `<span class="f">${esc(show(corr, true, true))}</span>`, bads.map(b => `<span class="f">${esc(b)}</span>`), exp); };
    const steps = [
      Object.assign(st(`Étape 1 : on supprime les ⇒ avec P ⇒ Q ≡ ¬P ∨ Q. On obtient :`, e, f, "Chaque P ⇒ Q devient ¬P ∨ Q, sans toucher au reste."), { label: "Supprimer les ⇒" }),
      Object.assign(st(`Étape 2 : on fait descendre les ¬ jusqu'aux variables (Morgan, ¬¬P ≡ P). On obtient :`, n, f, "¬(P ∧ Q) ≡ ¬P ∨ ¬Q, ¬(P ∨ Q) ≡ ¬P ∧ ¬Q, ¬¬P ≡ P."), { label: "Descendre les ¬" }),
      Object.assign(st(`Étape 3 : en distribuant ∨ sur ∧, une <b>FNC</b> équivalente est :`, c, f, "P ∨ (Q ∧ R) ≡ (P ∨ Q) ∧ (P ∨ R) : on obtient une conjonction de clauses."), { label: "FNC" }),
      Object.assign(st(`Étape 4 : en distribuant ∧ sur ∨, une <b>FND</b> équivalente est :`, d, f, "P ∧ (Q ∨ R) ≡ (P ∧ Q) ∨ (P ∧ R) : on obtient une disjonction de conjonctions de littéraux."), { label: "FND" }),
    ];
    return { context: `Mettre sous forme normale : <span class="f big">${esc(show(f))}</span>`, steps };

const FICHES = [
["Introduction", `
<p>La logique vérifie qu'une <b>conclusion</b> est nécessairement vraie dès que les <b>hypothèses</b> le sont. Elle juge la <b>validité</b> du raisonnement, pas la vérité des phrases.</p>
<p>Exemple : « Si A alors B. Or A est vraie. Donc B est vraie. » Ce schéma est correct quel que soit le sens de A et B.</p>
<h3>Une logique, c'est</h3><ul class="list"><li><b>Syntaxe</b> : comment écrire les formules</li><li><b>Sémantique</b> : la notion de vérité</li><li><b>Système de preuves</b> : Modus Ponens (A et A ⇒ B donnent B) et axiomes</li></ul>
<p><b>Cohérence</b> : on ne démontre que du vrai. <b>Complétude</b> : tout le vrai est démontrable. <b>Gödel (1931)</b> : toute logique assez large pour l'arithmétique est incomplète.</p>
<p>La logique propositionnelle travaille sur les booléens : elle est cohérente et complète, et ses calculs sont automatisables. La logique des prédicats est plus expressive mais incomplète.</p>`],
["Numération", `
<p><span class="code">(a<sub>n−1</sub>…a<sub>0</sub>)<sub>B</sub> = Σ a<sub>k</sub>·B<sup>k</sup></span>, chiffres de 0 à B−1 (puis A=10, B=11 … F=15 en hexadécimal).</p>
<h3>Base B → base 10</h3><p>On applique la définition. <span class="code">(101101)₂ = 1+4+8+32 = 45</span> ; <span class="code">(A2F)₁₆ = 10·256 + 2·16 + 15 = 2607</span>.</p>
<h3>Base 10 → base B</h3><p><b>Divisions successives par B</b> : les restes donnent les chiffres de droite à gauche (on lit de bas en haut). <span class="code">57 = (111001)₂</span>.</p>
<p>Pour la base 2 : décomposer en puissances de 2. <span class="code">179 = 128+32+16+2+1 = (10110011)₂</span>.</p>
<h3>Binaire ↔ hexadécimal</h3><p>Regrouper par <b>4 bits en partant de la droite</b>. <span class="code">(110 1100 1010 0111)₂ = (6CA7)₁₆</span>.</p>
<h3>Nombres à virgule</h3><p>Après la virgule : B<sup>−1</sup>, B<sup>−2</sup>… <span class="code">(1101,101)₂ = 13 + 0,5 + 0,125 = 13,625</span>.</p>
<p>Base 10 → base 2 : partie entière par divisions, partie fractionnaire par <b>multiplications successives par 2</b> (on garde la partie entière à chaque étape). <span class="code">0,8125 = (0,1101)₂</span>.</p>
<p>Un décimal peut avoir une écriture <b>infinie</b> en base 2 : <span class="code">0,1 = (0,000110011…)₂</span>. D'où <span class="code">0.1 + 0.2 == 0.3 → False</span> en Python. Python : <span class="code">0b…</span>, <span class="code">0x…</span>, <span class="code">bin()</span>, <span class="code">hex()</span>.</p>`],
["Syntaxe", `
<p>Alphabet : variables X₁, X₂…, connecteurs ¬ ∧ ∨ ⇒, parenthèses.</p>
<h3>Formules (plus petit ensemble tel que)</h3><p>X<sub>i</sub> ; si P et Q sont des formules : <span class="code">(¬P)</span>, <span class="code">(P ∧ Q)</span>, <span class="code">(P ∨ Q)</span>, <span class="code">(P ⇒ Q)</span>. Grammaire : A → X<sub>i</sub> | (¬A) | (A∧A) | (A∨A) | (A⇒A).</p>
<h3>Théorème de lecture unique</h3><p>Toute formule a une <b>unique</b> décomposition : X<sub>i</sub>, (¬P) ou (P c Q).</p>
<h3>Poids des parenthèses</h3><p>1re parenthèse : 1, puis +1 pour « ( » et −1 pour « ) ». La dernière est la seule de poids 0. Le <b>connecteur principal</b> est juste après la <b>première parenthèse fermante de poids 1</b>.</p>
<p>Exemple : <span class="code">(₁X₁ ∨ (₂X₂ ⇒ (₃¬X₃)₂)₁)₀</span></p>
<h3>Hauteur</h3><p>h(X<sub>i</sub>) = 0 ; h(¬P) = h(P)+1 ; h(P c Q) = max(h(P), h(Q))+1. Ex : h((X₁ ∨ X₂) ∧ ¬X₂) = 2.</p>
<p>Arbre : feuilles = variables, nœuds = connecteurs. Le nombre de parenthèses est pair ; le nombre de parenthèses imbriquées est égal à la hauteur.</p>`],
["Sémantique", `
<div class="scroll"><table class="tt"><tr><th>X</th><th>Y</th><th>¬X</th><th>X∧Y</th><th>X∨Y</th><th>X⇒Y</th></tr>
<tr><td>1</td><td>1</td><td>0</td><td>1</td><td>1</td><td>1</td></tr><tr><td>1</td><td>0</td><td>0</td><td>0</td><td>1</td><td><b>0</b></td></tr>
<tr><td>0</td><td>1</td><td>1</td><td>0</td><td>1</td><td>1</td></tr><tr><td>0</td><td>0</td><td>1</td><td>0</td><td>0</td><td>1</td></tr></table></div>
<p style="margin-top:10px"><b>Affectation</b> ν : variables → {0, 1}. On évalue de l'intérieur vers l'extérieur.</p>
<h3>Table de vérité</h3><p>2<sup>p</sup> lignes pour p variables. Ordre conseillé : X₁ = 1 puis X₁ = 0, chaque cas coupé selon X₂, etc. On ajoute une colonne par sous-formule.</p>
<h3>Définitions</h3><ul class="list"><li>ν <b>satisfait</b> P si eval<sub>ν</sub>(P) = 1</li><li>P <b>satisfiable</b> : ∃ν qui satisfait P (au moins une ligne à 1)</li>
<li>P <b>tautologie</b> : ∀ν, eval = 1 (toutes les lignes à 1)</li><li>P tautologie ⇔ ¬P non satisfiable</li>
<li>P ≡ Q : même évaluation pour toute ν ⇔ (P⇒Q)∧(Q⇒P) tautologie. <b>⇔</b> est un connecteur, <b>≡</b> n'en est pas un.</li></ul>
<h3>Simplifications partielles</h3><p>On fixe une variable à 1 puis à 0 et on simplifie avec les constantes : 0 ⇒ P ≡ 1, 1 ⇒ P ≡ P, P ∧ 0 ≡ 0, P ∨ 1 ≡ 1…</p>`],
["Équivalences", `
<ul class="list">
<li><b>Implication</b> : P ⇒ Q ≡ ¬P ∨ Q</li><li><b>Contraposée</b> : P ⇒ Q ≡ ¬Q ⇒ ¬P</li>
<li><b>Idempotence</b> : P ∨ P ≡ P, P ∧ P ≡ P</li><li><b>Associativité</b> : P ∧ (Q ∧ R) ≡ (P ∧ Q) ∧ R (idem ∨)</li>
<li><b>Commutativité</b> : P ∧ Q ≡ Q ∧ P (idem ∨)</li>
<li><b>Distributivité</b> : P ∧ (Q ∨ R) ≡ (P∧Q) ∨ (P∧R) ; P ∨ (Q ∧ R) ≡ (P∨Q) ∧ (P∨R)</li>
<li><b>Morgan</b> : ¬(P ∧ Q) ≡ ¬P ∨ ¬Q ; ¬(P ∨ Q) ≡ ¬P ∧ ¬Q</li>
<li><b>Absorption</b> : P ∧ (P ∨ Q) ≡ P ; P ∨ (P ∧ Q) ≡ P</li><li>¬¬P ≡ P ; P ⇒ P est une tautologie</li></ul>
<h3>Avec une tautologie V (≡ 1)</h3><p>P ∧ V ≡ P ; P ∨ V tautologie ; P ⇒ V tautologie ; V ⇒ P ≡ P.</p>
<h3>Avec une formule non satisfiable F (≡ 0)</h3><p>P ∧ F non satisfiable ; P ∨ F ≡ P ; P ⇒ F ≡ ¬P ; F ⇒ P tautologie.</p>
<h3>Substitution</h3><p>Une instance d'une tautologie est une tautologie ; on peut remplacer une sous-formule par une formule équivalente.</p>
<p>Exemple : (X₁ ⇒ X₂) ⇒ X₁ ≡ (¬(¬X₁ ∨ X₂)) ∨ X₁ ≡ (X₁ ∧ ¬X₂) ∨ X₁ ≡ X₁.</p>`],
["Formes normales", `
<ul class="list"><li><b>Littéral</b> : X<sub>i</sub> ou ¬X<sub>i</sub></li><li><b>Clause</b> : disjonction (∨) de littéraux</li>
<li><b>FNC</b> : conjonction (∧) de clauses. Ex : (X₁ ∨ ¬X₂) ∧ (¬X₁ ∨ X₃) ∧ X₄</li><li><b>FND</b> : disjonction (∨) de conjonctions de littéraux. Ex : (X₁ ∧ ¬X₂) ∨ (¬X₁ ∧ X₂)</li></ul>
<p>Une seule clause, ou une seule conjonction de littéraux, est à la fois FNC et FND.</p>
<h3>Mettre en forme normale</h3><ol class="list"><li>Supprimer les ⇒ : P ⇒ Q ≡ ¬P ∨ Q</li><li>Descendre les ¬ jusqu'aux variables (Morgan, ¬¬P ≡ P)</li><li>Distribuer ∧ sur ∨ (ou l'inverse)</li></ol>
<p>Ex : ¬(X₁ ⇒ (X₂ ∧ ¬X₃)) ≡ X₁ ∧ (¬X₂ ∨ X₃) [FNC] ≡ (X₁ ∧ ¬X₂) ∨ (X₁ ∧ X₃) [FND].</p>
<h3>FND depuis une table de vérité</h3><p>Pour chaque ligne à <b>1</b> : conjonction des littéraux (X<sub>i</sub> si 1, ¬X<sub>i</sub> si 0). Puis disjonction de toutes ces conjonctions. Donc toute fonction booléenne s'écrit avec une formule.</p>`],
["Prédicats", `
<p>On travaille sur un <b>domaine</b> D (ℕ, ℝ, des étudiants…).</p>
<ul class="list"><li><b>Constantes</b> (1, π), <b>variables</b> (x, y), <b>fonctions</b> d'arité n : Dⁿ → D (+, carré)</li>
<li><b>Relations</b> d'arité n : Dⁿ → {V, F} (≤ d'arité 2, positif d'arité 1)</li><li>Quantificateurs <b>∀</b> et <b>∃</b></li></ul>
<h3>Construction</h3><p><b>Terme</b> : constante, variable ou f(t₁,…,tₙ), qui donne un élément de D (ex : carre(1+n)∗3).<br>
<b>Formule atomique</b> : r(t₁,…,tₙ) (ex : max(1,n) = m, positif(x)).<br><b>Formule</b> : formules atomiques combinées avec ¬ ∧ ∨ ⇒, ∃x, ∀x.</p>
<h3>Évaluation</h3><p><b>Valuation</b> v : variables → D. Variable <b>libre</b> : non quantifiée (il faut lui donner une valeur). Variable <b>liée</b> : sous un ∀ ou un ∃.<br>
∀x F est vraie si F est vraie pour toute valeur de x ; ∃x F est vraie s'il existe une valeur qui marche.</p>
<h3>Négation</h3><p><span class="code">¬(∀x P) ≡ ∃x ¬P</span> &nbsp; <span class="code">¬(∃x P) ≡ ∀x ¬P</span></p>
<p>Ex : ¬∀x∀y((x&lt;y) ⇒ ∃z((x&lt;z)∧(z&lt;y))) ≡ ∃x∃y((x&lt;y) ∧ ∀z((x≥z) ∨ (z≥y))).</p>
<h3>Quantificateurs avec condition</h3><p><span class="code">∀x : r(x) P</span> = ∀x (r(x) <b>⇒</b> P) &nbsp; <span class="code">∃x : r(x) P</span> = ∃x (r(x) <b>∧</b> P). Dans la négation, on garde la condition.</p>
<p>« Tout étudiant appartient à un groupe » : ∀e ∈ E ∃g ∈ G appartient(e, g). L'ordre des quantificateurs compte.</p>`]
];
function fiches(i = 0) {
  clearInterval(timerId); run = null;
  app.innerHTML = `<div class="stack">${header()}<div class="row"><button onclick="home()">← Menu</button><h2>Fiches de cours</h2></div>
  <div class="tabs">${FICHES.map((f, k) => `<button class="${k === i ? "on" : ""}" onclick="fiches(${k})">${f[0]}</button>`).join("")}</div>
  <section class="card fiche"><h2 style="margin-bottom:10px">${FICHES[i][0]}</h2>${FICHES[i][1]}</section>
  <div class="row"><button class="primary" onclick="startWorld(${i})">S'entraîner sur ce chapitre →</button></div></div>`;
  window.scrollTo(0, 0);
}

document.addEventListener("keydown", e => {
  const t = e.target;
  if ((e.key === "Enter" || e.key === " ") && t && t.classList) {
    if (t.classList.contains("tok")) { e.preventDefault(); return selTok(+t.dataset.i); }
    if (t.classList.contains("cell")) { e.preventDefault(); return cell(+t.dataset.r); }
  }
  if (!run || !run.q) return;
  if (e.key === "Enter" && !(t && t.tagName === "BUTTON" && t.id !== "go")) { e.preventDefault(); validate(); }
  else if (run.q.kind === "choice" && !run.answered && /^[1-4]$/.test(e.key)) { const i = +e.key - 1; if (i < run.q.options.length) choose(i); }
});

/* Auto-test des générateurs (console : __selftest()) */
window.__selftest = function (n = 200) {
  const errs = [];
  const checkQ = (t, q) => {
    if (q.kind === "choice" && (q.answer < 0 || new Set(q.options).size !== q.options.length || q.options.length < 2)) errs.push([t, "options", q.prompt, q.options]);
    if (q.kind === "tokens" && q.tokens[q.answer].k !== "c") errs.push([t, "tok"]);
    if (q.kind === "input" && q.answerText != null && !q.check(q.answerText)) errs.push([t, "input", q.prompt]);
  };
  for (const t of Object.keys(TYPES)) for (let k = 0; k < n; k++) { try { checkQ(t, GEN[t]()); } catch (e) { errs.push([t, String(e)]); } }
  for (const k of Object.keys(EXOS)) for (let j = 0; j < n / 4; j++) { try { EXOS[k].make().steps.forEach(q => checkQ(k, q)); } catch (e) { errs.push([k, String(e)]); } }
  return errs.length ? errs.slice(0, 8) : "OK";
};
home();
